# Ambiente local e de verificação.
#   docker compose up -d mysql       sobe só o MySQL e roda os scripts de database/ (na primeira vez)
#   docker compose up -d --build     sobe o MySQL e a API (http://localhost:5080)
#   docker compose down -v           apaga o volume: na próxima subida os scripts rodam de novo
# As senhas padrão valem só para desenvolvimento local; troque pelo arquivo .env.

services:
  mysql:
    image: mysql:8.4
    container_name: prescricao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev}
      MYSQL_DATABASE: prescricao
      MYSQL_USER: prescricao_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prescricao-dev}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: prescricao-api
    environment:
      MySql__ConnectionString: Server=mysql;Port=3306;Database=prescricao;User=prescricao_app;Password=${MYSQL_PASSWORD:-prescricao-dev}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      # Porta do host configurável: no Windows a 8080 costuma estar reservada pelo sistema.
      - "${API_PORT:-5080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
